services:
  # Cron job for running the forecasting script monthly
  - type: cron
    name: shopify-aov-forecast
    env: python
    plan: starter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    schedule: "0 3 1 * *"  # Run at 3 AM on the 1st day of every month
    envVars:
      - key: SHOPIFY_API_TOKEN
        sync: false  # This should be set manually in Render dashboard for security
      - key: SHOPIFY_STORE_DOMAIN
        sync: false  # This should be set manually in Render dashboard for security 