name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Display Python version
      run: python --version
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Prepare workspace
      run: |
        mkdir -p reports
        touch forecasting.log
        echo "Test log content" > forecasting.log
        ls -la
        ls -la reports/
    
    - name: Run tests
      run: |
        python tests/run_tests.py
        # Create a dummy report file in case tests don't generate one
        if [ ! -s forecasting.log ]; then
          echo "Tests completed" > forecasting.log
        fi
        if [ ! "$(ls -A reports/ 2>/dev/null)" ]; then
          echo "Creating dummy report file"
          echo "test,value" > reports/test_report.csv
        fi
        # Show what files were created
        echo "Files in current directory:"
        ls -la
        echo "Files in reports directory:"
        ls -la reports/
    
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts-${{ matrix.python-version }}
        path: |
          forecasting.log
          reports/**/*.csv
        if-no-files-found: warn
        retention-days: 7
        compression-level: 9
        overwrite: true 